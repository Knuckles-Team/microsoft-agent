[bumpversion]
current_version = 2.3.1
commit = True
tag = True

[bumpversion:file:README.md]
search = Current package version: **{current_version}**
replace = Current package version: **{new_version}**

[bumpversion:file:microsoft_agent/_version.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file(docker-img):docker/Dockerfile]
search = =={current_version}"
replace = =={new_version}"
