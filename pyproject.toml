[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-agent"
dynamic = ["version"]
description = "Governed Microsoft Graph agent and MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "agent-utilities[mcp]>=1.27.1,<2.0.0",
  "azure-core>=1.41.0",
  "httpx>=0.28.1",
  "keyring>=25.7.0",
  "msal>=1.37.0",
  "msgraph-sdk>=1.59.2",
  "pydantic>=2.13.4",
]
license = "MIT"

[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.optional-dependencies]
mcp = ["agent-utilities[mcp]>=1.27.1,<2.0.0"]
agent = ["agent-utilities[agent-runtime,logfire]>=1.27.1,<2.0.0"]
documents = ["python-docx>=1.2.0", "python-pptx>=1.0.2"]
cloud = ["azure-identity>=1.25.3", "httpx>=0.28.1"]
windows = [
  "cryptography>=49.0.0",
  "msal[broker]>=1.31,<2.0; sys_platform == 'win32'",
  "pywin32>=308; sys_platform == 'win32'",
  "win10toast>=0.9; sys_platform == 'win32'",
]
control-plane = [
  "cryptography>=49.0.0",
  "fastapi>=0.139.2",
  "PyJWT[crypto]>=2.13.0",
  "uvicorn>=0.51.0",
]
docs = ["mkdocs-material>=9.7.7"]
all = [
  "agent-utilities[mcp,agent-runtime,logfire]>=1.27.1,<2.0.0",
  "azure-identity>=1.25.3",
  "cryptography>=49.0.0",
  "fastapi>=0.139.2",
  "httpx>=0.28.1",
  "mkdocs-material>=9.7.7",
  "PyJWT[crypto]>=2.13.0",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "uvicorn>=0.51.0",
  "msal[broker]>=1.31,<2.0; sys_platform == 'win32'",
  "pywin32>=308; sys_platform == 'win32'",
  "win10toast>=0.9; sys_platform == 'win32'",
]
test = [
  "cryptography>=49.0.0",
  "fastapi>=0.139.2",
  "httpx>=0.28.1",
  "PyJWT[crypto]>=2.13.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-env>=1.7.0",
  "pytest-timeout>=2.4.0",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "PyYAML>=6.0.3",
]

[project.scripts]
microsoft-mcp = "microsoft_agent.mcp_server:mcp_server"
microsoft-agent = "microsoft_agent.agent_server:agent_server"
microsoft-config = "microsoft_agent.config_cli:main"
microsoft-windows-companion = "microsoft_agent.windows_companion_service:main"
microsoft-windows-control-plane = "microsoft_agent.windows_control_plane_service:main"

[project.entry-points."agent_utilities.source_connector_providers"]
microsoft-agent = "microsoft_agent.connectors"

[project.entry-points."agent_utilities.skill_providers"]
microsoft-agent = "microsoft_agent.skills"

[project.entry-points."agent_utilities.ontology_providers"]
microsoft-agent = "microsoft_agent.ontology"

[project.entry-points."agent_utilities.prompt_providers"]
microsoft-agent = "microsoft_agent.prompts"

[dependency-groups]
dev = [
  "mypy>=1.15,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "pytest-env>=1.1,<2",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.15,<1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "microsoft_agent._version.__version__"}

[tool.setuptools.package-data]
microsoft_agent = ["connectors/**", "ontology/**", "prompts/**", "skills/**"]

[tool.setuptools.exclude-package-data]
microsoft_agent = ["**/*.wal", "**/*.db"]

[tool.setuptools.packages.find]
where = ["."]
include = ["microsoft_agent", "microsoft_agent.*"]
namespaces = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "skip"

[tool.vulture]
ignore_names = ["request", "config"]
