[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-agent"
version = "2.3.6"
description = "Governed Microsoft Graph agent and MCP server"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = [ "scion-sdk[mcp]>=0.5.6,<1.0.0", "azure-core>=1.41.0", "httpx>=0.28.1", "keyring>=25.7.0", "msal>=1.39.0", "msgraph-sdk>=1.64.0", "pydantic>=2.14.1",]
license = "MIT"

[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.optional-dependencies]
mcp = [ "scion-sdk[mcp]>=0.5.6,<1.0.0",]
documents = ["python-docx>=1.2.0", "python-pptx>=1.0.2"]
cloud = ["azure-identity>=1.26.0", "httpx>=0.28.1"]
windows = [
  "cryptography>=50.0.2",
  "msal[broker]>=1.39.0,<2.0; sys_platform == 'win32'",
  "pywin32>=312; sys_platform == 'win32'",
  "win10toast>=0.9; sys_platform == 'win32'",
]
control-plane = [
  "cryptography>=50.0.2",
  "fastapi>=0.143.3",
  "PyJWT[crypto]>=2.15.1",
  "uvicorn>=0.54.0",
]
docs = ["mkdocs-material>=9.7.7"]
all = [
  "azure-identity>=1.26.0",
  "cryptography>=50.0.2",
  "fastapi>=0.143.3",
  "httpx>=0.28.1",
  "mkdocs-material>=9.7.7",
  "PyJWT[crypto]>=2.15.1",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "uvicorn>=0.54.0",
  "msal[broker]>=1.39.0,<2.0; sys_platform == 'win32'",
  "pywin32>=312; sys_platform == 'win32'",
  "win10toast>=0.9; sys_platform == 'win32'",
]
test = [
  "cryptography>=50.0.2",
  "fastapi>=0.143.3",
  "httpx>=0.28.1",
  "PyJWT[crypto]>=2.15.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-env>=1.8.0",
  "pytest-timeout>=2.4.0",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "PyYAML>=6.0.3",
]

[project.scripts]
microsoft-mcp = "microsoft_agent.mcp_server:mcp_server"
microsoft-config = "microsoft_agent.config_cli:main"
microsoft-windows-companion = "microsoft_agent.windows_companion_service:main"
microsoft-windows-control-plane = "microsoft_agent.windows_control_plane_service:main"

[project.entry-points."agent_connector_sdk.source_connector_providers"]
microsoft-agent = "microsoft_agent.connectors"

[project.entry-points."agent_connector_sdk.skill_providers"]
microsoft-agent = "microsoft_agent.skills"

[project.entry-points."agent_connector_sdk.ontology_providers"]
microsoft-agent = "microsoft_agent.ontology"

[project.entry-points."agent_connector_sdk.prompt_providers"]
microsoft-agent = "microsoft_agent.prompts"

[dependency-groups]
dev = [
  "bump2version>=1.0.1,<2",
  "mypy>=2.4.0,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "pytest-env>=1.8.0,<2",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.17.1,<1",
]

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
microsoft-mcp = "microsoft_agent"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
microsoft_agent = ["connectors/**", "ontology/**", "prompts/**", "skills/**"]

[tool.setuptools.exclude-package-data]
microsoft_agent = ["**/*.wal", "**/*.db"]

[tool.setuptools.packages.find]
where = ["."]
include = ["microsoft_agent", "microsoft_agent.*"]
namespaces = false

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "skip"

[tool.vulture]
ignore_names = ["request", "config"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
