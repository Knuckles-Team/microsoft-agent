site_name: "microsoft-agent"
site_url: "https://knuckles-team.github.io/microsoft-agent/"
site_description: "Governed Microsoft Graph MCP provider and optional A2A agent."
copyright: "Copyright &copy; Project contributors — MIT licensed"

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/graph-outline
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: overview.md
  - Install and configure:
      - Installation: installation.md
      - Configuration: configuration.md
      - Authentication: authentication.md
      - Enrollment checklist: enrollment-checklist.md
  - Operate:
      - Usage: usage.md
      - Deployment: deployment.md
  - Integrations:
      - Microsoft services: integrations.md
      - Office add-in: office-addin.md
      - Windows companion: windows-companion.md
  - Concepts: concepts.md
