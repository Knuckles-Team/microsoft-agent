default_language_version:
  python: python3
exclude: 'dotnet|node_modules'
ci:
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: 'monthly'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2000"]
        exclude: ^uv\.lock$
      - id: check-ast
        exclude: ^(tests/|test/|scripts/|script/)
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: check-json
      - id: fix-byte-order-marker
        exclude: .gitignore
      - id: check-merge-conflict
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: no-commit-to-branch
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: d1b833175a5d08a925900115526febd8fe71c98e # v0.15.11
    hooks:
      - id: ruff-check
        args: ["--fix", "--ignore=E402,B008,E501"]
        exclude: ^(tests/|test/|scripts/|script/)
      - id: ruff-format
        exclude: ^(tests/|test/|scripts/|script/)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: f40886d54c729f533f864ed6ce584e920feb0af7 # v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic==2.13.4, types-PyYAML==6.0.12.20260518, types-requests==2.33.0.20260518, types-setuptools==83.0.0.20260706]
        args: ["--ignore-missing-imports"]
  - repo: https://github.com/jendrikseipp/vulture
    rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # v2.16
    hooks:
      - id: vulture
        pass_filenames: false
        args: [ ".", "--min-confidence", "95", "--exclude", "node_modules,dotnet" ]
        require_serial: true
  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
    hooks:
      - id: codespell
        args: ["-L", "ans,linar,nam,tread,ot,", "--ignore-words=.codespellignore"]
        exclude: ^(tests/|test/|scripts/|script/|.*lock.*)
  - repo: https://github.com/nbQA-dev/nbQA
    rev: d31b7eae1767c43460afb3ba130e0a6602933abe # 1.9.1
    hooks:
      - id: nbqa-ruff
        args: ["--fix"]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 6a280ba12b7901e47757c868c8c13c6a624c9ecb # 0.11.7
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: security-sanitizer
        name: security and privacy sanitizer
        entry: python scripts/security_sanitizer.py
        language: system
        pass_filenames: false
        always_run: true
      - id: security-contract
        name: validate repository security contract
        entry: python scripts/security_contract.py --contract .security/security-contract.json validate
        language: system
        pass_filenames: false
        always_run: true
      - id: verify-api-integration
        name: verify API-to-MCP integration coverage
        entry: python scripts/verify_api_integration.py --local
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
