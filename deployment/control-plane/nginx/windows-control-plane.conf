# Install this file in /etc/nginx/conf.d/ after replacing every example path
# and hostname. The file is included from nginx's `http` context.

map $ssl_client_verify $microsoft_agent_client_thumbprint {
    default "";
    SUCCESS $ssl_client_fingerprint;
}

log_format microsoft_agent_control_plane
    '$status $body_bytes_sent $request_time';

upstream microsoft_windows_control_plane {
    server 127.0.0.1:8443;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name companion.example.invalid;

    server_tokens off;
    access_log /var/log/nginx/microsoft-agent-control-plane.access.log
        microsoft_agent_control_plane;
    error_log /var/log/nginx/microsoft-agent-control-plane.error.log warn;

    ssl_certificate /etc/microsoft-agent/tls/control-plane-fullchain.pem;
    ssl_certificate_key /etc/microsoft-agent/tls/control-plane-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MicrosoftAgentControlPlane:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Workers must chain to this private CA. Controller requests do not need a
    # client certificate, so verification is optional at the TLS handshake and
    # required below only for the fixed worker relay routes.
    ssl_client_certificate /etc/microsoft-agent/tls/companion-client-ca.pem;
    ssl_verify_client optional;
    ssl_verify_depth 3;
    # Enable a current issuer CRL when your PKI publishes one:
    # ssl_crl /etc/microsoft-agent/tls/companion-client-ca.crl.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 65m;
    client_body_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 75s;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;

    # Uvicorn intentionally ignores proxy identity headers. Clear the common
    # variants anyway, and replace—not append—the one header trusted by the
    # application with a value derived only from Nginx's verified TLS session.
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Client-Cert-Thumbprint
        $microsoft_agent_client_thumbprint;

    location ~ ^/v1/devices/[^/]+/relay(?:/|$) {
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }
        proxy_pass http://microsoft_windows_control_plane;
    }

    location / {
        proxy_pass http://microsoft_windows_control_plane;
    }
}
